# ┃                    Enviroment Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/hyprland/defaults.conf

# ------------------ Gaming ------------------
env = PRESSURE_VESSEL_FILESYSTEMS_RW, /data:/windows
env = WINEPREFIX, $HOME/.local/share/umu/prefixes/cici
env = PROTONPATH, /usr/share/steam/compatibilitytools.d/proton-cachyos-slr
env = DXVK_CONFIG_FILE, $HOME/.config/dxvk.conf


# ------------------ Theme ------------------
env = XDG_MENU_PREFIX, arch-kbuildsycoca6
env = QT_QPA_PLATFORMTHEME, qt6ct
env = XCURSOR_THEME, moga-candy-black
envd = XCURSOR_SIZE, 24
envd = HYPRCURSOR_SIZE, 24
envd = QT_CURSOR_SIZE, 24


# ------------------ Others ------------------
env = TERMINAL, $terminal
env = UV_CACHE_DIR, /data/.cache/uv
