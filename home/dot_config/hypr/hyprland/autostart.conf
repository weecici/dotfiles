# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/hyprland/defaults.conf

# Autostart wiki https://wiki.hyprland.org/Configuring/Keywords/#executing

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = sway-audio-idle-inhibit
exec-once = mako
exec-once = nm-applet --indicator

# Slow app launch fix
exec-once = systemctl --user import-environment
exec-once = dbus-update-activation-environment --systemd

# idk
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Dank Material Shell
exec-once = dms run

# Default Apps
exec-once = $idlehandler
exec-once = $input_method
exec-once = $screen_color_filter

# Utils
exec-once = sh ~/.scripts/change_bg.sh /usr/share/grub/themes/cigrub/bgs/ /usr/share/grub/themes/cigrub/bg.png 
