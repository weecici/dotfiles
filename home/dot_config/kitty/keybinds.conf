# Tab management
map alt+.                       next_tab
map alt+,                       previous_tab
map alt+shift+.                 move_tab_forward
map alt+shift+,                 move_tab_backward
map alt+t                       new_tab
map alt+q                       close_tab

# Window management
map alt+]                       next_window
map alt+[                       previous_window
map alt+enter                   new_window
map alt+shift+enter             close_window
